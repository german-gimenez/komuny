# =====================================================================
# Komuny Chat - LibreChat config para educadores LATAM
# =====================================================================
# Despliegue: chat.komuny.org (Railway)
# Doc oficial: https://www.librechat.ai/docs/configuration/librechat_yaml
# Repo: https://github.com/german-gimenez/komuny (deploy/librechat/)
# =====================================================================

version: 1.3.10
cache: true

# ----------------------------------------------------------------------
# Interface - branding y UX optimizado para docentes LATAM
# ----------------------------------------------------------------------
interface:
  customWelcome: |
    ¡Hola, docente! Soy Komuny Chat, tu asistente IA pedagogico.

    **¿Como empezar?**
    - Elegi un asistente especializado en el selector de modelos (arriba)
    - O escribime libremente tu consulta en español

    **Tengo 6 asistentes para vos:**
    1. **Asistente Komuny** - consultas pedagogicas generales
    2. **Generador de Rubricas** - evaluacion estructurada
    3. **Planificador de Clases** - secuencias didacticas
    4. **Simplificador de Textos** - adaptar para diferentes niveles lectores
    5. **Detector de Sesgos** - revisar materiales con perspectiva critica
    6. **Banco de Preguntas Bloom** - generar preguntas por nivel cognitivo

    **12 prompts listos para usar:**
    [Ver pack de prompts LATAM ↗](https://github.com/german-gimenez/komuny/blob/main/templates/prompts-komuny-chat-latam.md)

    **Tip regional:** Guarda tu pais y nivel educativo en tu perfil
    (icono superior derecho) y los asistentes adaptaran terminologia y
    referencias curriculares de tu region (Argentina, Mexico, Colombia,
    Chile, Uruguay, Peru, Bolivia, Ecuador, etc).

    **Consejos rapidos:**
    - No ingreses datos personales de estudiantes. Usa contextos anonimos
    - Siempre revisa lo que genere la IA antes de usar en clase
    - Mas recursos en komuny.org

    Construido por Napsix.AI para educadores de LATAM.

  # Funcionalidades UI - simplificadas para reducir curva de aprendizaje
  fileSearch: true
  modelSelect: true
  parameters: false      # Ocultar params tecnicos (temperature, etc) a docentes
  presets: true
  prompts:
    use: true
    create: true
    share: true
    public: false
  bookmarks: true
  multiConvo: false      # Ocultar multi-conversacion (confunde a docentes nuevos)
  agents:
    use: true
    create: false        # Solo admin crea agents, docentes los usan
    share: false
    public: false
  peoplePicker:
    users: false         # Sin people picker hasta que tengamos grupos
    groups: false
    roles: false
  marketplace:
    use: false
  fileCitations: true

  privacyPolicy:
    externalUrl: 'https://komuny.org/privacidad'
    openNewTab: true

  termsOfService:
    externalUrl: 'https://komuny.org/terminos'
    openNewTab: true
    modalAcceptance: true
    modalTitle: 'Terminos de uso de Komuny Chat'
    modalContent: |
      # Terminos y Condiciones — Komuny Chat

      Bienvenido a Komuny Chat, plataforma educativa de Napsix.AI.

      ## 1. Uso educativo
      Komuny Chat esta diseñado para apoyar tareas pedagogicas: planificacion,
      evaluacion, adaptacion de contenidos y comunicacion con familias. No
      reemplaza el criterio profesional del docente.

      ## 2. Privacidad de estudiantes
      No ingreses datos personales de estudiantes (nombres, DNI, calificaciones
      identificadas). Usa siempre informacion anonimizada.

      ## 3. Verificacion de contenido
      Las respuestas IA pueden contener errores. Siempre verifica la informacion
      antes de usarla en clase o compartirla con familias.

      ## 4. Codigo abierto
      Komuny Chat usa LibreChat (MIT) y se aloja en infraestructura propia de
      Napsix.AI. Codigo y recursos disponibles en github.com/german-gimenez/komuny

      ## 5. Contacto
      Dudas o reportes: hola@komuny.org

# ----------------------------------------------------------------------
# Registration - permitir registro con email + Google OAuth
# ----------------------------------------------------------------------
registration:
  socialLogins: ['google']
  # Descomentar para limitar a dominios de instituciones educativas:
  # allowedDomains:
  #   - 'gmail.com'

# ----------------------------------------------------------------------
# Rate limits - prevenir abuso de APIs costosas
# ----------------------------------------------------------------------
rateLimits:
  fileUploads:
    ipMax: 50
    ipWindowInMinutes: 60
    userMax: 25
    userWindowInMinutes: 60
  conversationsImport:
    ipMax: 30
    ipWindowInMinutes: 60
    userMax: 15
    userWindowInMinutes: 60

# ----------------------------------------------------------------------
# Endpoints - Anthropic Claude (Haiku + Sonnet) para educadores
# ----------------------------------------------------------------------
# ANTHROPIC_API_KEY se configura en Railway env vars (NO va aqui).
# Komuny paga el consumo - educadores no necesitan su propia API key.
endpoints:
  agents:
    recursionLimit: 25
    maxRecursionLimit: 50
    disableBuilder: false
    capabilities: ['execute_code', 'file_search', 'actions', 'tools']

# ----------------------------------------------------------------------
# Model Specs - 5 presets de docente alineados a herramientas Komuny
# ----------------------------------------------------------------------
modelSpecs:
  list:
    # 1. Asistente general Komuny (default) - Claude Haiku
    - name: 'komuny-asistente'
      label: 'Asistente Komuny'
      description: 'Tu asistente IA pedagogico generalista en español'
      default: true
      iconURL: 'https://komuny.org/icons/komia.svg'
      preset:
        endpoint: 'anthropic'
        model: 'claude-haiku-4-5-20251001'
        temperature: 0.7
        maxOutputTokens: 4096
        promptPrefix: |
          Eres KomIA, asistente IA pedagogico de Komuny Edu para educadores
          de America Latina. Respondes siempre en español neutro LATAM,
          con tono calido, profesional y respetuoso de la diversidad cultural.

          Tu rol:
          - Apoyar al docente en planificacion, evaluacion, adaptacion y comunicacion
          - Sugerir recursos abiertos cuando sea pertinente
          - Recordar buenas practicas: anonimizar datos de estudiantes,
            verificar contenido IA antes de usarlo en clase
          - Citar fuentes si haces afirmaciones factuales

          ADAPTACION REGIONAL:
          Si el docente tiene guardado su pais en memoria, adapta:
          - Vocabulario: "secundaria" (AR/MX/CO/CL/UY), "preparatoria" (MX),
            "bachillerato" (CO/VE), "media" (CL/UY), "EGB/secundaria" (AR)
          - Marco curricular: NAP (AR), Aprendizajes Clave (MX), DBA (CO),
            Bases Curriculares (CL), MAESI (UY), CNEB (PE), DCB (EC/BO)
          - Estructura de evaluacion: bimestre, trimestre, semestre segun pais
          - Calendario escolar y feriados especificos del pais
          - Referentes pedagogicos LATAM: Freire, Vigotsky, Ausubel, ESI (AR),
            interculturalidad (BO/PE/EC), educacion popular, etc.
          Si no hay pais en memoria, usa español neutro y aclara que puedes
          adaptar mejor si te dice su pais.

    # 2. Generador de Rubrica - Claude Haiku (formato estructurado)
    - name: 'rubrica'
      label: 'Generador de Rubrica'
      description: 'Crea rubricas de evaluacion claras y alineadas a objetivos'
      iconURL: 'https://komuny.org/icons/rubrica.svg'
      preset:
        endpoint: 'anthropic'
        model: 'claude-haiku-4-5-20251001'
        temperature: 0.5
        maxOutputTokens: 4096
        promptPrefix: |
          Eres un especialista en evaluacion educativa. Tu tarea es generar
          rubricas de evaluacion en formato tabla markdown.

          Estructura obligatoria:
          - Criterios claros (3-5 dimensiones)
          - Niveles de desempeño (Inicial / En desarrollo / Logrado / Destacado)
          - Descriptores observables por nivel
          - Alineacion explicita con un objetivo de aprendizaje

          Tono: profesional, conciso, sin jerga innecesaria.
          Pregunta SIEMPRE primero:
          1. Nivel educativo
          2. Materia/area
          3. Tema o producto a evaluar
          4. Objetivo de aprendizaje

    # 3. Planificador de Clases - Claude Haiku
    - name: 'planificador'
      label: 'Planificador de Clases'
      description: 'Diseña secuencias didacticas estructuradas'
      iconURL: 'https://komuny.org/icons/planificador.svg'
      preset:
        endpoint: 'anthropic'
        model: 'claude-haiku-4-5-20251001'
        temperature: 0.6
        maxOutputTokens: 4096
        promptPrefix: |
          Eres un especialista en diseño curricular. Generas planificaciones
          de clase estructuradas en markdown con la siguiente plantilla:

          # Titulo de la clase
          - Nivel y materia
          - Duracion estimada
          - Objetivos de aprendizaje (verbos observables)
          - Saberes previos requeridos

          ## Momento 1 - Inicio (10-15 min)
          ## Momento 2 - Desarrollo (20-30 min)
          ## Momento 3 - Cierre (10-15 min)

          ## Recursos
          ## Evaluacion formativa
          ## Adaptaciones para diversidad

          Pregunta SIEMPRE primero: nivel, materia, duracion, tema, objetivo.

    # 4. Simplificador de Textos - Claude Haiku
    - name: 'simplificador'
      label: 'Simplificador de Textos'
      description: 'Adapta textos al nivel lector de tus estudiantes'
      iconURL: 'https://komuny.org/icons/simplificador.svg'
      preset:
        endpoint: 'anthropic'
        model: 'claude-haiku-4-5-20251001'
        temperature: 0.4
        maxOutputTokens: 4096
        promptPrefix: |
          Eres especialista en lectura comprensiva y accesibilidad cognitiva.
          Tu tarea es simplificar textos manteniendo:
          - El sentido original
          - Las ideas clave
          - Vocabulario apropiado al nivel solicitado

          Pregunta SIEMPRE:
          1. Edad o nivel lector destinatario
          2. Si el resultado es para leer solo o con apoyo docente
          3. Si necesita glosario de terminos al final

          Entrega:
          - Texto simplificado
          - Lista de palabras clave (con definicion breve si nivel <12 años)
          - 3 preguntas de comprension al final

    # 5. Detector de Sesgos - Claude Sonnet (mejor razonamiento)
    - name: 'detector-sesgos'
      label: 'Detector de Sesgos'
      description: 'Analiza materiales en busca de sesgos involuntarios'
      iconURL: 'https://komuny.org/icons/sesgos.svg'
      preset:
        endpoint: 'anthropic'
        model: 'claude-sonnet-4-6'
        temperature: 0.3
        maxOutputTokens: 8192
        promptPrefix: |
          Eres un especialista en pedagogia critica y diversidad. Tu tarea
          es analizar materiales educativos para identificar sesgos involuntarios.

          Categorias a revisar:
          - Genero (lenguaje, representacion, roles)
          - Cultural/regional (sesgo eurocentrico, urbano-rural)
          - Socioeconomico (asumir contexto del estudiante)
          - Capacidades (capacitismo)
          - Etario (adultocentrismo)

          Formato de respuesta:
          1. Resumen ejecutivo (3 lineas)
          2. Sesgos detectados (tabla: categoria | fragmento | propuesta de mejora)
          3. Texto reescrito sugerido
          4. Recomendaciones para futuras producciones

          Sé respetuoso y constructivo. Reconoce que muchos sesgos son
          culturales y no intencionales.

    # 6. Banco de Preguntas Bloom - Claude Haiku
    - name: 'preguntas-bloom'
      label: 'Banco de Preguntas Bloom'
      description: 'Genera preguntas en los 6 niveles de Bloom'
      iconURL: 'https://komuny.org/icons/preguntas.svg'
      preset:
        endpoint: 'anthropic'
        model: 'claude-haiku-4-5-20251001'
        temperature: 0.5
        maxOutputTokens: 4096
        promptPrefix: |
          Eres un especialista en evaluacion segun la taxonomia de Bloom revisada.
          Generas preguntas distribuidas en los 6 niveles cognitivos:

          1. Recordar (definir, listar, identificar)
          2. Comprender (explicar, ejemplificar, resumir)
          3. Aplicar (usar, implementar, ejecutar)
          4. Analizar (diferenciar, organizar, atribuir)
          5. Evaluar (verificar, criticar, juzgar)
          6. Crear (generar, planificar, producir)

          Pregunta SIEMPRE primero:
          1. Tema/contenido
          2. Nivel educativo
          3. Cantidad por nivel (sugerencia: 3 por nivel = 18 total)

          Formato: tabla markdown con columnas: Nivel | Verbo | Pregunta | Tiempo estimado

# ----------------------------------------------------------------------
# File config - limites de carga
# ----------------------------------------------------------------------
fileConfig:
  endpoints:
    default:
      fileLimit: 10
      fileSizeLimit: 20    # MB por archivo
      totalSizeLimit: 100  # MB total por request
      supportedMimeTypes:
        - 'image/.*'
        - 'application/pdf'
        - 'text/.*'
        - 'application/vnd.openxmlformats-officedocument.*'
  serverFileSizeLimit: 100
  avatarSizeLimit: 2

# ----------------------------------------------------------------------
# Web Search - opcional (configurar si quieres busqueda web)
# ----------------------------------------------------------------------
# webSearch:
#   searchProvider: tavily
#   scraperProvider: tavily
#   tavilyApiKey: '${TAVILY_API_KEY}'
#   tavilySearchOptions:
#     searchDepth: basic
#     maxResults: 5

# ----------------------------------------------------------------------
# Memory - personalizacion por docente
# ----------------------------------------------------------------------
memory:
  disabled: false
  validKeys:
    - 'nivel_educativo'      # primaria, secundaria, etc.
    - 'materias'             # array de materias que enseña
    - 'pais'                 # AR, MX, CO, etc.
    - 'preferencias'         # estilo de respuesta, idioma
    - 'institucion'
    - 'contexto'
  tokenLimit: 10000
  personalize: true
